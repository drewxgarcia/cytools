[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cytools/_version.py"
pattern = 'version = "(?P<version>[^"]+)"'

[project]
name = "cytools"
dynamic = ["version"]
description = "A software package for analyzing Calabi-Yau hypersurfaces in toric varieties."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Liam McAllister Group", email = ""}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "joblib",
    "cvxopt",
    "python-flint",
    "pplpy",
    "ortools==9.15.*",      # bundles HiGHS 1.12; keep matched to highspy below
    "triangulumancer>=0.3",
    "pypalp",
    "cygv>=0.2.3",
    "regfans>=0.2.1",
    "tqdm",
    "qpsolvers",
    "requests",
    "osqp>=1.0",
    "latticepts",
    "extremalrays",
    "platformdirs",
    "highspy==1.12.*",      # must match ortools' bundled HiGHS (SONAME clash)
    "pandas",
    "pyarrow",
    "sympy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
benchmark = ["pytest", "pytest-benchmark"]
gnn = ["dualgnn"]
mosek = ["Mosek"]
normaliz = ["PyNormaliz>=2.24"]
notebook = ["huggingface-hub", "jupyterlab", "ipywidgets"]
performance = ["scikit-sparse>=0.5.0"]  # CHOLMOD; needs SuiteSparse
streaming = ["huggingface-hub"]
test = ["pytest"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-benchmark",
  "ruff",
  "ty",
]

[tool.ruff]
# 88 is the de-facto standard already in this tree: outside `f_theory/`, only
# 122 of 30k lines exceed it.
line-length = 88
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
  "E9",   # syntax and indentation failures
  "F",    # undefined, unused, and shadowed names
]
ignore = [
  # Docstrings in this project are the published API reference (rendered by
  # docs/documentation/produce_doc.py), and contain long example lines and URLs
  # that must not be wrapped. The formatter enforces code line length.
  "E501",
  # `l` is conventional for a lattice/linear-relation index throughout the
  # geometry code; renaming would obscure the mathematics.
  "E741",
]

[tool.ruff.lint.per-file-ignores]
# These compatibility namespaces intentionally mirror their implementation
# modules. Replace the wildcard exports when their public APIs are stabilized.
"src/cytools/f_theory/__init__.py" = ["F403"]
"src/cytools/ntfe/__init__.py" = ["F403"]
"src/cytools/vector_config/__init__.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = ["slow: long-running benchmarks (deselect with -m 'not slow')"]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://cy.tools"
Documentation = "https://cy.tools/docs/documentation/"
Repository = "https://github.com/LiamMcAllisterGroup/cytools"
Changelog = "https://github.com/LiamMcAllisterGroup/cytools/blob/main/CHANGELOG.md"
Issues = "https://github.com/LiamMcAllisterGroup/cytools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cytools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/cytools",
  "/demos/*.ipynb",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/INSTALL.md",
]
