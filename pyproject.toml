[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cytools/_version.py"
pattern = 'version = "(?P<version>[^"]+)"'

[project]
name = "cytools-workbench"
dynamic = ["version"]
description = "A notebook-first fork of CYTools for reproducible Calabi-Yau landscape studies."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Liam McAllister Group", email = ""}
]
maintainers = [
  {name = "Drew Garcia"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "joblib",
    "python-flint",
    "pplpy",
    "ortools==9.15.*",      # bundles HiGHS 1.12; keep matched to highspy below
    "triangulumancer>=0.3",
    "pypalp",
    "cygv>=0.2.3",
    "regfans>=0.2.1",
    "tqdm",
    "qpsolvers",
    "requests",
    "osqp>=1.0",
    "latticepts",
    "extremalrays",
    "platformdirs",
    "highspy==1.12.*",      # must match ortools' bundled HiGHS (SONAME clash)
    "pandas",
    "pyarrow",
    "sympy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
benchmark = ["pytest", "pytest-benchmark"]
cvxopt = ["cvxopt"]
gnn = ["dualgnn"]
mosek = ["Mosek"]
normaliz = ["PyNormaliz>=2.24"]
notebook = ["huggingface-hub", "jupyterlab", "ipywidgets"]
performance = ["scikit-sparse>=0.5.0"]  # CHOLMOD; needs SuiteSparse
streaming = ["huggingface-hub"]  # fetch database shards not present locally
test = ["pytest"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-benchmark",
  "ruff",
  "ty",
]

[tool.ruff]
# Keep syntax broadly upstreamable even though the distribution supports 3.12+.
# 88 is the de-facto standard already in this tree: outside `f_theory/`, only
# 122 of 30k lines exceed it.
line-length = 88
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
  "E9",   # syntax and indentation failures
  "F",    # undefined, unused, and shadowed names
  "I",    # deterministic import ordering
  "B904", # preserve exception context at translation boundaries
  "UP",   # keep syntax aligned with the upstream-compatible Python 3.10 target
  "W",    # whitespace defects not handled by the formatter
]
ignore = [
  # Docstrings in this project are the published API reference (rendered by
  # docs/documentation/produce_doc.py), and contain long example lines and URLs
  # that must not be wrapped. The formatter enforces code line length.
  "E501",
  # `l` is conventional for a lattice/linear-relation index throughout the
  # geometry code; renaming would obscure the mathematics.
  "E741",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "slow: long-running benchmarks (deselect with -m 'not slow')",
  "requires_dependency(name): integration owned by an optional dependency",
]
# The repository root, so `tests/test_repro_published.py` can import the
# reproduction scripts under `benchmarks/` instead of restating the paper's
# definitions. Set explicitly rather than relying on `python -m pytest`
# happening to put the working directory on the path.
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/drewxgarcia/cytools"
Documentation = "https://github.com/drewxgarcia/cytools#readme"
Repository = "https://github.com/drewxgarcia/cytools"
Changelog = "https://github.com/drewxgarcia/cytools/blob/main/CHANGELOG.md"
Issues = "https://github.com/drewxgarcia/cytools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cytools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/cytools",
  "/demos/*.ipynb",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/INSTALL.md",
]
