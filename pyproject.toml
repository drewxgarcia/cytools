[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cytools/_version.py"
pattern = 'version = "(?P<version>[^"]+)"'

[project]
name = "cytools-workbench"
dynamic = ["version"]
description = "A notebook-first fork of CYTools for reproducible Calabi-Yau landscape studies."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Liam McAllister Group", email = ""}
]
maintainers = [
  {name = "Drew Garcia"}
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "joblib",
    "python-flint",
    "pplpy",
    "ortools==9.15.*",      # bundles HiGHS 1.12; keep matched to highspy below
    "triangulumancer>=0.3",
    "pypalp",
    "cygv>=0.2.3",
    "regfans>=0.2.1",
    "tqdm",
    "qpsolvers",
    "requests",
    "osqp>=1.0",
    "latticepts",
    "extremalrays",
    "platformdirs",
    "highspy==1.12.*",      # must match ortools' bundled HiGHS (SONAME clash)
    "pandas",
    "pyarrow",
    "sympy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
benchmark = ["pytest", "pytest-benchmark"]
cvxopt = ["cvxopt"]
gnn = ["dualgnn"]
mosek = ["Mosek"]
normaliz = ["PyNormaliz>=2.24"]
notebook = ["huggingface-hub", "jupyterlab", "ipywidgets"]
performance = ["scikit-sparse>=0.5.0"]  # CHOLMOD; needs SuiteSparse
streaming = ["huggingface-hub"]  # fetch database shards not present locally
test = ["pytest"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-benchmark",
  "ruff",
  "ty",
]

[tool.ruff]
# 88 is the de-facto standard already in this tree: outside `f_theory/`, only
# 122 of 30k lines exceed it.
line-length = 88
# Deliberately below `requires-python = ">=3.12"`, and kept in lockstep with
# `python-version` in ty.toml -- a split target is how `datetime.UTC` got
# suggested by the linter and rejected by the type checker. Raising both is
# staged work; see the note in ty.toml.
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
# A rule belongs here only if a violation would be *fixed* rather than
# suppressed. pycodestyle is selected as E4/E7/E9 rather than a blanket `E`
# precisely to leave E501 out: docstrings are the published API reference
# (rendered by docs/documentation/produce_doc.py) and carry long example lines
# and URLs that must not be wrapped, while the formatter already owns code
# width. Prefer narrowing `select` over widening `ignore`: an unselected rule
# cannot go stale, whereas an `ignore` entry has to stay true. The one entry
# below is reachable and load-bearing, and RUF100 keeps per-line `noqa` honest.
select = [
  "E4",     # imports: placement and one-per-line
  "E7",     # statement-level defects, incl. ambiguous names and `== None/False`
  "E9",     # syntax and indentation failures
  "F",      # undefined, unused, and shadowed names
  "I",      # deterministic import ordering
  "UP",     # modernize syntax up to the `target-version` floor
  "W",      # whitespace defects not handled by the formatter
  "PIE",    # misc anti-patterns; already clean, kept as a ratchet
  "FURB",   # further modernizations up to the same floor
  "C4",     # comprehension and collection-call defects; `dict()` -> `{}` etc.
  "RSE",    # no parentheses on bare `raise X()`
  "TID",    # tidy imports: no relative imports across package boundaries
  "Q",      # quote consistency, aligned with the formatter
  "ICN",    # conventional import aliases (`import numpy as np`)
  "INT",    # gettext f-string defects
  "SLOT",   # `__slots__` on subclasses of immutable builtins
  "FLY",    # `str.join` over a static sequence instead of `+`
  "PERF",   # loop-level performance defects
  "B",      # bugbear: silent `zip` truncation, mutable defaults, dead exprs
  "RUF100", # a `noqa` naming a non-enabled rule is rot, not documentation
]
ignore = [
  # try/except inside a loop. The rule predates PEP 659 zero-cost exceptions:
  # on the 3.12+ this package requires, entering a `try` that does not raise is
  # free, so restructuring the 60 sites would buy no measurable time while
  # flattening error handling that is currently local and readable. Measured,
  # not assumed -- this project's north star is wall-clock, not rule counts.
  "PERF203",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "slow: long-running benchmarks (deselect with -m 'not slow')",
  "requires_dependency(name): integration owned by an optional dependency",
]
# The repository root, so `tests/test_repro_published.py` can import the
# reproduction scripts under `benchmarks/` instead of restating the paper's
# definitions. Set explicitly rather than relying on `python -m pytest`
# happening to put the working directory on the path.
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/drewxgarcia/cytools"
Documentation = "https://github.com/drewxgarcia/cytools#readme"
Repository = "https://github.com/drewxgarcia/cytools"
Changelog = "https://github.com/drewxgarcia/cytools/blob/main/CHANGELOG.md"
Issues = "https://github.com/drewxgarcia/cytools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cytools"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/cytools",
  "/demos/*.ipynb",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/INSTALL.md",
]
