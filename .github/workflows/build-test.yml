name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'dvg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install project
        run: uv sync --frozen --python 3.14
      - name: Lint source
        run: uv run --frozen ruff check src
      - name: Check source formatting
        run: uv run --frozen ruff format --check src
      - name: Type-check
        run: uv run --frozen ty check

  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        python-version: ['3.10', '3.14']
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install project
        run: uv sync --frozen --extra normaliz --python "${{ matrix.python-version }}"
      - name: Run pytest
        run: uv run --frozen python -m pytest -vv
      - name: Build wheel
        run: uv build --wheel --out-dir dist-ci
      - name: Verify public modules are packaged
        run: >-
          uv run --frozen python -c 'import glob, zipfile;
          names=zipfile.ZipFile(glob.glob("dist-ci/*.whl")[0]).namelist();
          required={"cytools/__init__.py", "cytools/_version.py", "cytools/dataset.py", "cytools/landscape.py", "cytools/store.py"};
          assert required <= set(names), sorted(required - set(names))'

  backends:
    name: Optional compiled backends
    runs-on: macos-14
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install SuiteSparse
        # scikit-sparse is sdist-only and needs the CHOLMOD headers to build.
        run: brew install suite-sparse libomp
      - name: Install Python
        run: uv python install 3.14
      - name: Install project with every compiled backend
        env:
          CFLAGS: -I/opt/homebrew/include/suitesparse -I/opt/homebrew/include
          LDFLAGS: -L/opt/homebrew/lib
        run: >-
          uv sync --frozen --extra gnn --extra normaliz --extra performance
          --python 3.14
      - name: Reconcile OpenMP runtimes
        # Homebrew SuiteSparse and PyTorch each bring their own LLVM OpenMP
        # runtime, and the second to register aborts the process. Point PyTorch
        # at the one already present. See INSTALL.md.
        run: |
          bundled=$(uv run --frozen --no-sync python -c 'import torch, pathlib; print(pathlib.Path(torch.__file__).parent / "lib" / "libomp.dylib")')
          ln -sf "$(brew --prefix libomp)/lib/libomp.dylib" "$bundled"
          ls -l "$bundled"
      - name: Run pytest
        # This is the configuration that exercises CHOLMOD and the GNN sampler
        # in one process -- the combination a bare matrix run never reaches.
        run: uv run --frozen --no-sync python -m pytest -vv
