name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'dvg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install portable development environment
        run: uv sync --frozen --python 3.14
      - name: Lint source
        run: uv run --frozen ruff check src
      - name: Check source formatting
        run: uv run --frozen ruff format --check src
      - name: Type-check
        run: uv run --frozen ty check

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.14
      - name: Build wheel and source distribution
        run: uv build --out-dir dist-ci
      - name: Verify package identity and wheel contents
        run: >-
          python -c 'import glob, zipfile;
          wheel=glob.glob("dist-ci/cytools_workbench-*.whl")[0];
          names=set(zipfile.ZipFile(wheel).namelist());
          required={"cytools/__init__.py", "cytools/_version.py", "cytools/dataset.py", "cytools/landscape.py", "cytools/store.py"};
          assert required <= names, sorted(required - names)'
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist-ci/*

  test:
    name: Wheel · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist-ci
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create clean environment
        run: uv venv --python "${{ matrix.python-version }}" .venv
      - name: Install built wheel
        run: uv pip install --python .venv/bin/python dist-ci/*.whl pytest
      - name: Run pytest against installed wheel
        run: .venv/bin/python -m pytest -vv

  notebook:
    name: Notebook smoke test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist-ci
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create clean environment
        run: uv venv --python 3.14 .venv
      - name: Install the notebook extra from the built wheel
        run: |
          wheel=$(find dist-ci -name '*.whl' -print -quit)
          uv pip install --python .venv/bin/python "${wheel}[notebook]"
      - name: Execute the offline quickstart
        run: >-
          .venv/bin/jupyter nbconvert --to notebook --execute
          demos/quickstart.ipynb --output cytools-quickstart.ipynb
          --output-dir /tmp --ExecutePreprocessor.timeout=180

  backends:
    name: Extra · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CVXOPT
            extra: cvxopt
            tests: tests/test_cone.py -k cvxopt
            system-packages: ''
          - name: GNN
            extra: gnn
            tests: tests/test_gnn_sampler.py
            system-packages: ''
          - name: Normaliz
            extra: normaliz
            tests: tests/test_cone.py -k hilbert_basis
            system-packages: ''
          - name: CHOLMOD
            extra: performance
            tests: tests/test_solvers.py
            system-packages: libsuitesparse-dev
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist-ci
      - name: Install system dependencies
        if: matrix.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.system-packages }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create clean environment
        run: uv venv --python 3.14 .venv
      - name: Install extra from the built wheel
        run: |
          wheel=$(find dist-ci -name '*.whl' -print -quit)
          uv pip install --python .venv/bin/python "${wheel}[${{ matrix.extra }}]" pytest
      - name: Run targeted backend tests
        run: .venv/bin/python -m pytest -vv ${{ matrix.tests }}
