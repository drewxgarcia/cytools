name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SDist
        run: pipx run build --sdist
      - name: Verify SDist contains package sources
        run: >-
          python -c 'import glob, tarfile;
          p=glob.glob("dist/*.tar.gz")[0];
          names=tarfile.open(p).getnames();
          relative=[name.split("/", 1)[1] for name in names if "/" in name];
          forbidden=("benchmarks/", "tests/", "demos/", "scripts/");
          assert any(n.endswith("/src/cytools/__init__.py") for n in names), names;
          assert not any(name.startswith(forbidden) for name in relative), sorted(name for name in relative if name.startswith(forbidden))'
      - uses: actions/upload-artifact@v7
        with:
          name: ci-sdist
          path: dist/*.tar.gz

  make-wheel:
    name: Make Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Wheel
        run: pipx run build --wheel
      - name: Verify wheel contains CYTools
        run: >-
          python -c 'import glob, zipfile;
          p=glob.glob("dist/*.whl")[0];
          names=zipfile.ZipFile(p).namelist();
          forbidden=("benchmarks/", "tests/", "demos/", "scripts/");
          assert {"cytools/__init__.py", "cytools/py.typed"} <= set(names), names;
          assert not any(name.startswith(forbidden) for name in names), sorted(name for name in names if name.startswith(forbidden))'
      - uses: actions/upload-artifact@v7
        with:
          name: ci-wheel
          path: dist/*.whl

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [make-sdist, make-wheel]
    environment:
      name: pypi
      url: https://pypi.org/p/cytools-workbench
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: ci-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
